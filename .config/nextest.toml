# Generated by `cargo xtask verification-sync`; edit verification/registry.json.

[profile.default]
retries = 0
flaky-result = "fail"
fail-fast = false
test-threads = 4

[test-groups]
unit = { max-threads = 4 }
contract = { max-threads = 2 }
ui = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(mirante4d-app) & test(=tests::typed_import_commands_cancel_resume_publish_and_open_without_a_display)'
slow-timeout = { period = "5s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(mirante4d-import-pipeline) & test(=promoted_source_facts_drive_production_inspection_decode_and_publication)'
slow-timeout = { period = "10s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(mirante4d-import-pipeline) & test(=cancellation_matrix_resumes_to_one_identity_across_every_prepublication_stage)'
slow-timeout = { period = "20s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(mirante4d-app) & (test(=tests::import_analyze_save_and_reopen_without_a_global_integrity_audit) | test(=tests::imported_publication_waits_for_project_close_then_installs_without_an_integrity_audit) | test(=tests::failed_project_close_retains_imported_authority_without_an_audit_fallback) | test(=tests::imported_transfer_drift_fails_closed_without_external_open_fallback))'
slow-timeout = { period = "5s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(mirante4d-project-store) & test(=actor::tests::hosted_durability_tests::exhaustive_hosted_and_process_transition_matrix)'
threads-required = "num-test-threads"
slow-timeout = { period = "20s", terminate-after = 9 }

[[profile.default.overrides]]
filter = 'package(mirante4d-project-store) & test(=actor::tests::purge_fresh_process_kill_and_retry_matrix)'
slow-timeout = { period = "5s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'package(mirante4d-import-pipeline) & test(=process_checkpoint_recovery_survives_forced_worker_termination)'
slow-timeout = { period = "10s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(mirante4d-analysis-core) | package(mirante4d-analysis-runtime) | package(mirante4d-application) | package(mirante4d-dataset) | package(mirante4d-dataset-runtime) | package(mirante4d-domain) | package(mirante4d-identity) | package(mirante4d-project-model) | package(mirante4d-render-api) | package(mirante4d-render-reference) | package(mirante4d-render-wgpu) | package(mirante4d-settings) | package(xtask)'
test-group = 'unit'
slow-timeout = { period = "500ms", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'package(mirante4d-import-pipeline) | package(mirante4d-project-store) | package(mirante4d-storage)'
test-group = 'contract'
slow-timeout = { period = "5s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'package(mirante4d-app) | package(mirante4d-ui-egui)'
test-group = 'ui'
slow-timeout = { period = "2s", terminate-after = 5 }

[profile.leaf]
inherits = "default"
global-timeout = "12m"

[profile.leaf.junit]
path = "junit.xml"
report-name = "mirante4d-verification-leaf"
store-success-output = false
store-failure-output = true

[profile.pr]
inherits = "default"
global-timeout = "5m"

[profile.pr.junit]
path = "junit.xml"
report-name = "mirante4d-pr-rust"
store-success-output = false
store-failure-output = true

[profile.trusted-gpu-correctness]
inherits = "default"
test-threads = 1
global-timeout = "15m"

[[profile.trusted-gpu-correctness.overrides]]
filter = '((package(mirante4d-app) & test(/^gpu_memory::tests::selected_vulkan_adapter_reports_typed_device_local_memory$/)) | (package(mirante4d-app) & test(/^tests::unsafe_3d_profile_keeps_native_preview_visible_until_atomic_exact_strips_finish$/)) | (package(mirante4d-app) & test(/^tests::exact_transient_cross_section_updates_all_linked_panels_before_finish_and_empty_clears_them$/)) | (package(mirante4d-app) & test(/^tests::incremental_linked_zoom_pixels_match_direct_fine_cpu_oracle_after_one_settlement_plan$/)) | (package(mirante4d-app) & test(/^tests::direct_timepoint_selection_replaces_retained_gpu_pixels_with_the_successor_body$/))) | ((package(mirante4d-render-wgpu) & test(/^gpu_tests::volume_page_traversal_crosses_sub_epsilon_direction_for_all_kernels_and_pick$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::volume_page_traversal_zero_direction_stays_in_one_page$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::volume_page_traversal_subnormal_direction_is_portably_canonicalized_or_rejected$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::volume_page_traversal_far_boundary_overflow_clamps_only_to_ray_exit$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::existing_device_constructor_publishes_color_before_pick_readiness$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::progressive_plane_falls_back_by_whole_footprint_and_invalid_never_falls_through$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::dedicated_mip_off_axis_color_matches_independent_numerical_oracle$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::dedicated_iso_affine_lighting_and_six_tap_halo_match_independent_reference$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::dedicated_mixed_mip_iso_authored_over_matches_independent_hand_facts$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::dedicated_dvr_off_axis_perspective_uses_physical_world_distance$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::resident_body_cha