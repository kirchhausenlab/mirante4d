[profile.gpu-performance]
inherits = "default"
test-threads = 1
global-timeout = "30m"

[[profile.gpu-performance.overrides]]
filter = '((package(mirante4d-render-wgpu) & test(/^gpu_tests::native_1080p_terminal_navigation_gpu_timing$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::fixed_lod_multichannel_gpu_timing_matrix$/)) | (package(mirante4d-render-wgpu) & test(/^gpu_tests::resident_coordinated_volume_gpu_timing$/)))'
